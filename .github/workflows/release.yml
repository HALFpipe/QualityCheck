on:
  push:
    tags:
      - "*.*.*"  # Any tag that looks like a version

name: release

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # installs the Node version pinned in .mise.toml
      - uses: jdx/mise-action@v2

      - run: mise run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/index.html --draft --title "Release $GITHUB_REF_NAME"
