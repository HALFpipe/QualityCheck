on:
  push:
    tags:
      - "*.*.*"  # Any tag that looks like a version

name: release

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # installs the Node version pinned in .mise.toml
      - uses: jdx/mise-action@v2

      # node-sass 7 does not compile on current Node; sass-loader uses Dart Sass when present
      - run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts sass@1.108.2

      - run: npm run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/index.html --draft --title "Release $GITHUB_REF_NAME"
