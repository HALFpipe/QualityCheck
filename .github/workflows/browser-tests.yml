name: browser tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base:
        description: "Ref to compare against"
        default: main

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
      CHROME_BIN: google-chrome

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set paths
        run: |
          echo "BUILDS=$RUNNER_TEMP/builds" >> "$GITHUB_ENV"
          echo "RESULTS=$RUNNER_TEMP/results" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # node-sass 7 does not compile on current Node; sass-loader uses Dart Sass when present
      - name: Install (head)
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts sass@1.108.2

      - name: Build (head)
        run: |
          npm run build
          mkdir -p "$BUILDS/head" && cp dist/index.html "$BUILDS/head/"

      - name: "TC-0: unit tests"
        run: npm test

      - name: "TC-1: no collections dependency"
        run: |
          if grep -rnE "from ['\"]collections|require\(['\"]collections" src; then exit 1; fi
          node -e 'const p = require("./package.json"); if ("collections" in {...p.dependencies, ...p.devDependencies}) process.exit(1)'

      - name: Build (base)
        run: |
          base=$(git rev-parse --verify -q "$BASE_REF^{commit}" || git rev-parse --verify "origin/$BASE_REF^{commit}")
          echo "Comparing against $base"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          cd "$RUNNER_TEMP/base"
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts sass@1.108.2
          npm run build
          mkdir -p "$BUILDS/base" && cp dist/index.html "$BUILDS/base/"

      - name: Profile base and head
        run: |
          mkdir -p "$RESULTS"
          for spec in base:200 head:200 base:500 head:500 head:2000 head:4000; do
            build=${spec%%:*} n=${spec##*:}
            echo "::group::$build, $n subjects"
            node bench/profile.mjs "$BUILDS/$build/index.html" "$n" "$RUNNER_TEMP/work" > "$RESULTS/$build-$n.json"
            echo "::endgroup::"
          done

      - name: "TC-6, TC-7: ratings move points correctly (40k images)"
        run: node bench/check-ratings.mjs "$BUILDS/head/index.html" 4000 "$RUNNER_TEMP/work" | tee "$RESULTS/ratings.json"

      - name: "TC-2 to TC-5: compare and check budgets"
        env:
          ALLOW_LAYOUT_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'layout-change') && '1' || '0' }}
        run: node bench/ci-assert.mjs "$RESULTS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: ${{ runner.temp }}/results
